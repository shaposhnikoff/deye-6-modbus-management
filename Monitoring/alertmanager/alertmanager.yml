# Alertmanager routing for the Deye inverter.
# Substitute the placeholders before use:
#   envsubst < alertmanager.yml > /etc/alertmanager/alertmanager.yml
# Required environment: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Validate with: amtool check-config alertmanager.yml

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: telegram
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: HTML
        send_resolved: true
        message: |
          {{ range .Alerts -}}
          <b>{{ .Status | toUpper }}: {{ .Labels.alertname }}</b>
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - alertname = DeyeExporterDown
    target_matchers:
      - job = deye
    equal: ["instance"]
