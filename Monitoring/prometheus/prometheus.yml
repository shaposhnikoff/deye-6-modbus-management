# Prometheus scrape configuration for the Deye inverter.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    site: home

rule_files:
  - rules/*.rules

scrape_configs:
  - job_name: deye_modbus
    scrape_timeout: 10s
    static_configs:
      - targets: ["192.168.10.39:9101"]
        labels:
          inverter: sun6k
          model: SUN-6K-SG05LP1
          site: home
