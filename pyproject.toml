[project]
name = "deye-monitoring"
version = "0.1.0"
description = "Read-only Modbus RTU monitoring for a Deye hybrid inverter on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
dmon = "deye_monitoring.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/deye_monitoring/registers.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
